<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D SMART ERP v2.0</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/dashboard-v2.css">
<link rel="stylesheet" href="./css/enterprise.css">
</head>

<body>

<div class="sidebar">
    <div class="logo"><b class="brand-mark">D</b><span>D SMART<small>ERP · ENTERPRISE 2.0</small></span></div>

    <button class="active" onclick="showPage('dashboard',this)">🏠 대시보드</button>
    <button onclick="showPage('inventory',this)">📦 재고관리</button>
    <button onclick="showPage('movement',this)">🚚 입출고관리</button>
    <button onclick="showPage('production',this)">🏭 생산관리</button>
    <button onclick="showPage('materials',this)">🧱 원자재관리</button>
    <button onclick="showPage('warehouse',this)">🏬 창고관리</button>
    <button onclick="showPage('purchase',this)">📋 구매·발주관리</button>
    <button onclick="showPage('partners',this)">🤝 거래처관리</button>
    <button onclick="showPage('sales',this)">💰 매입·매출관리</button>
    <button onclick="showPage('business',this)">📊 영업관리</button>
    <button onclick="showPage('employees',this)">👥 인사관리</button>
    <button onclick="showPage('tasks',this)">📅 업무관리</button>
    <button onclick="showPage('documents',this)">📁 문서관리</button>
    <button onclick="showPage('settings',this)">⚙️ 시스템관리</button>

    <p class="notice" style="padding:15px;color:#94a3b8">
    D SMART ERP v2.0
</p>
</div>

<div class="main">

    <a class="skip-link" href="#workspace">본문 바로가기</a><div class="utility-bar"><span>D SMART ERP <em>/</em> Enterprise workspace</span><span><i></i> 업무 관리 <b class="avatar">AD</b> 관리자</span></div><div id="workspace" tabindex="-1" class="header">
        <h1 id="pageTitle">대시보드</h1>
        <span class="environment">관리자</span>
    </div>

    <div id="dashboard" class="page active">
        <div class="cards">
            <div class="card">
                <h3>전체 등록 품목</h3>
                <strong id="totalProducts">0</strong>
            </div>

            <div class="card">
                <h3>전체 재고 수량</h3>
                <strong id="totalStock">0</strong>
            </div>

            <div class="card">
                <h3>누적 입고 수량</h3>
                <strong id="totalIn">0</strong>
            </div>

            <div class="card">
                <h3>누적 출고 수량</h3>
                <strong id="totalOut">0</strong>
            </div>
        </div>

        <div class="panel">
            <h2>최근 입출고 내역</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>일시</th>
                            <th>제품명</th>
                            <th>구분</th>
                            <th>수량</th>
                        </tr>
                    </thead>
                    <tbody id="recentTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="inventory" class="page">
        <div class="panel">
            <h2>제품 등록</h2>

            <form id="productForm">
                <input id="productCode" placeholder="제품코드" required>
                <input id="productName" placeholder="제품명" required>
                <input id="productUnit" placeholder="단위 (EA, BOX 등)" required>
                <button class="action" type="submit">제품 등록</button>
            </form>
        </div>

        <div class="panel">
            <h2>재고 현황</h2>
            <input id="searchProduct" placeholder="제품 검색">

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>제품코드</th>
                            <th>제품명</th>
                            <th>단위</th>
                            <th>현재 재고</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="movement" class="page">
        <div class="panel">
            <h2>입출고 등록</h2>

            <form id="movementForm">
                <select id="movementProduct" required></select>

                <select id="movementType">
                    <option value="입고">입고</option>
                    <option value="출고">출고</option>
                </select>

                <input
                    id="movementQty"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="수량"
                    required
                >

                <button class="action" type="submit">
                    입출고 등록
                </button>
            </form>
        </div>

        <div class="panel">
            <h2>전체 입출고 내역</h2>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>일시</th>
                            <th>제품코드</th>
                            <th>제품명</th>
                            <th>구분</th>
                            <th>수량</th>
                        </tr>
                    </thead>
                    <tbody id="movementTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="otherPage" class="page">
        <div class="panel">
            <h2 id="otherTitle"></h2>
            <p>이 기능은 다음 개발 단계에서 추가됩니다.</p>
        </div>
    </div>

</div>
